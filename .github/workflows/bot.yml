name: sync

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          STEEM_POSTING_KEY: ${{ secrets.STEEM_POSTING_KEY }}
          STEEM_ACCOUNT: ${{ vars.STEEM_ACCOUNT }}
          DRY_RUN: ${{ vars.DRY_RUN }}
          MAX_PER_RUN: ${{ vars.MAX_PER_RUN }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
          MIN_RC_PCT: ${{ vars.MIN_RC_PCT }}
        run: python bot.py

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add sync_state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "update state" && git push)
